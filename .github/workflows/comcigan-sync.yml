name: Comcigan Timetable Auto Sync

on:
  schedule:
    # 한국 시간 기준 월~금 07:30 (UTC 22:30, 일~목)
    - cron: '30 22 * * 0-4'
    # 예비: 한국 시간 월~금 08:10. GitHub 예약 실행은 가끔 빠지므로(2026-11-20 아침 07:30 실행이 아예 안 생김) 한 번 더 돈다.
    # 같은 문서를 덮어쓰기만 해서 두 번 돌아도 괜찮다.
    - cron: '10 23 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '저장하지 않고 가져온 내용만 확인'
        type: boolean
        default: false

# 두 예약이 늦게 시작해 겹치면 앞의 것이 끝난 뒤 돈다
concurrency:
  group: comcigan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/comcigan
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 컴시간 크롤링 실행
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node sync-comcigan.cjs
