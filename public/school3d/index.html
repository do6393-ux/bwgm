<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script>window.SCHOOL3D_GLB = "buwon_floors.glb"; window.SCHOOL3D_ROOMS = "rooms.json"; window.SCHOOL3D_CAMPUS = "buwon_campus.glb";</script>
<title>부원여중 층별 분해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* buwon.vercel.app 'office' 테마에 맞춤: 거의 검정 바탕, 1px 선, 각진 모서리, Pretendard + Space Mono,
   주황 강조(#FF5000) 하나와 확인용 초록(#00E599). 레이아웃: 왼쪽 열 = 소개·길찾기·층별 실, 오른쪽 = 층 탭, 아래 = 분해 */
:root {
  --page: #050505;
  --well: #0A0A0A;
  --surface: #111111;
  --raised: #1A1A1A;
  --line: #222222;
  --line-strong: #333333;
  --line-hover: #444444;
  --ink: #E5E5E5;
  --ink-strong: #FFFFFF;
  --muted: #888888;
  --faint: #666666;
  --accent: #FF5000;
  --accent-strong: #FF3000;
  --accent-ink: #FFFFFF;
  --ok: #00E599;
  --ok-ink: #04140B;
  --panel: rgba(17, 17, 17, 0.92);
  --m-ease: cubic-bezier(.4, 0, .2, 1);
  --m-dur: .18s;
  --f-sans: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "Space Mono", Pretendard, ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans KR", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(110% 85% at 55% 45%, #141414 0%, var(--page) 65%) fixed, var(--page);
  color: var(--ink);
  font-family: var(--f-sans);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
#stage { position: fixed; inset: 0; z-index: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
body.picking #stage canvas { cursor: crosshair; }
#labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.hud { position: fixed; z-index: 2; }

/* 왼쪽 열 */
.side {
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: calc(max(16px, env(safe-area-inset-left, 0px)) + 4px);
  width: min(340px, calc(100vw - 100px));
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 120px);
  display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; overscroll-behavior: contain; padding-right: 2px;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.intro { display: grid; gap: 8px; padding-bottom: 4px; }
.eyebrow {
  margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
h1 {
  margin: 0; font-weight: 700; font-size: clamp(22px, 2.4vw, 28px);
  line-height: 1.2; letter-spacing: -.025em; color: var(--ink-strong); text-wrap: balance;
}
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.keys b { font-family: var(--f-mono); font-weight: 700; font-size: 11px; color: var(--ink); }

.card {
  background: var(--panel); border: 1px solid var(--line);
  padding: 14px; display: grid; gap: 12px;
}
.card > summary, .card header {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); cursor: pointer; list-style: none;
}
.card > summary::-webkit-details-marker { display: none; }
.card > summary::after { content: "−"; color: var(--faint); }
.card:not([open]) > summary::after { content: "+"; }
.card h2 { margin: 0; font: inherit; }
.count { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--ok); font-weight: 400; }
.route-body { display: grid; gap: 10px; }

.field { display: grid; grid-template-columns: 40px 1fr auto; align-items: stretch; gap: 0; }
.field .tag {
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
  border: 1px solid var(--line-strong); border-right: none; color: var(--muted); background: var(--well);
}
.field .tag.from { color: var(--page); background: var(--ink-strong); border-color: var(--ink-strong); }
.field .tag.to { color: var(--ok-ink); background: var(--ok); border-color: var(--ok); }
select {
  min-width: 0; width: 100%; font: inherit; font-size: 13px; color: var(--ink);
  background: var(--well); border: 1px solid var(--line-strong); border-radius: 0; padding: 8px 8px;
}
select:hover { border-color: var(--line-hover); }
.field .btn { border-left: none; }
.btn {
  font: inherit; font-weight: 700; font-size: 12px;
  padding: 8px 12px; border-radius: 0; cursor: pointer; white-space: nowrap;
  background: transparent; color: var(--ink); border: 1px solid var(--line-strong);
  transition: border-color var(--m-dur) var(--m-ease), background var(--m-dur) var(--m-ease), color var(--m-dur) var(--m-ease);
}
.btn:hover { border-color: var(--line-hover); color: var(--ink-strong); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pickhint { font-size: 12px; color: var(--accent); }
/* 건물 사이 길: 구름다리로 / 바깥으로 */
.via { display: grid; grid-template-columns: 1fr 1fr; }
.via .btn { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 8px 10px; }
.via .btn + .btn { border-left: none; }
.via .btn small { font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--muted); }
.via .btn[aria-pressed="true"] { border-color: var(--ok); color: var(--ink-strong); box-shadow: inset 0 0 0 1px var(--ok); }
.via .btn[aria-pressed="true"] small { color: var(--ok); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; counter-reset: st; }
.steps li { position: relative; padding: 0 0 10px 28px; font-size: 13px; line-height: 1.45; counter-increment: st; }
.steps li::before {
  content: counter(st); position: absolute; left: 0; top: 1px; width: 18px; height: 18px;
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px;
  border: 1px solid var(--ok); color: var(--ok);
}
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 20px; bottom: 1px; width: 1px; background: var(--line-strong); }
.steps li.end::before { background: var(--ok); color: var(--ok-ink); }
.note { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
.chip {
  font: inherit; font-size: 12px; line-height: 1; padding: 7px 9px; cursor: pointer;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink); border-radius: 0;
  transition: border-color var(--m-dur) var(--m-ease);
}
.chip:hover { border-color: var(--ok); color: var(--ink-strong); }
.link {
  font: inherit; font-size: 12px; color: var(--muted); background: none; border: none; padding: 0;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start;
}
.link:hover { color: var(--ink); }

/* 건물 선택 + 층 탭 */
.floors {
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 10px;
}
.bseg, .ftabs { display: flex; flex-direction: column; }
.btab {
  width: 52px; height: 38px; padding: 0; cursor: pointer; border-radius: 0;
  font: inherit; font-size: 12px; font-weight: 700; letter-spacing: -0.01em;
  background: var(--panel); color: var(--muted); border: 1px solid var(--line-strong);
  transition: background var(--m-dur) var(--m-ease), color var(--m-dur) var(--m-ease), border-color var(--m-dur) var(--m-ease);
}
.btab + .btab { margin-top: -1px; }
.btab:hover { border-color: var(--line-hover); color: var(--ink-strong); position: relative; z-index: 1; }
.btab[aria-pressed="true"] { background: var(--ink-strong); color: var(--page); border-color: var(--ink-strong); position: relative; z-index: 2; }
.btab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ftab {
  position: relative; width: 52px; height: 56px; padding: 0;
  display: grid; place-content: center; justify-items: center; gap: 2px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 0; cursor: pointer; font: inherit;
  transition: background var(--m-dur) var(--m-ease), color var(--m-dur) var(--m-ease), border-color var(--m-dur) var(--m-ease);
}
.ftab + .ftab { margin-top: -1px; }
.ftab .n { font-family: var(--f-mono); font-weight: 700; font-size: 20px; line-height: 1; }
.ftab .u { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.ftab:hover { border-color: var(--line-hover); z-index: 1; }
.ftab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); z-index: 2; }
.ftab[aria-pressed="true"] .u { color: var(--accent-ink); }

/* 확대·축소 (전자칠판용 큰 버튼) */
.zoom { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; }
.zbtn {
  width: 56px; height: 56px; font-family: var(--f-mono); font-size: 26px; line-height: 1; cursor: pointer; border-radius: 0;
  background: var(--panel); color: var(--ink-strong); border: 1px solid var(--line-strong);
  transition: border-color var(--m-dur) var(--m-ease), background var(--m-dur) var(--m-ease);
}
.zbtn + .zbtn { margin-top: -1px; }
.zbtn:hover { border-color: var(--line-hover); position: relative; z-index: 1; }
.zbtn:active { background: var(--accent); border-color: var(--accent); }
.zbtn.home { font-size: 20px; }
.zbtn.txt { font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); }
.zbtn.txt[aria-pressed="true"] { color: var(--accent); }
/* 창 높이가 낮을 때(교실 PC 배율 125·150% 등) 층 탭과 확대·축소 묶음이 겹치지 않게:
   960 이하 = 층 탭을 위(84px, 포털 닫기 단추 아래)로 붙임, 709 이하 = 확대·축소 묶음을 층 탭 왼쪽 줄로 옮김 */
@media (min-width: 721px) and (max-height: 960px) {
  .floors { top: calc(env(safe-area-inset-top, 0px) + 84px); transform: none; }
}
@media (min-width: 721px) and (max-height: 709px) {
  .zoom { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 68px); }
}
@media (min-width: 721px) and (max-width: 819px) and (max-height: 709px) {
  .zoom { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }   /* 아래 분해 조작 막대와 안 겹치게 */
}

/* 아래 분해 조작 */
.controls {
  left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  width: min(520px, calc(100vw - 32px));
}
.dock { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
.slider { flex: 1; min-width: 0; display: grid; gap: 6px; }
.slider .lab {
  display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.slider .lab b { font-weight: 700; color: var(--ink-strong); font-variant-numeric: tabular-nums; letter-spacing: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.btn:focus-visible, .ftab:focus-visible, .flbl:focus-visible, .chip:focus-visible, .link:focus-visible,
select:focus-visible, input[type="range"]:focus-visible, .card > summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* 3D 위 라벨 */
.lbl, .slbl, .mk { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; line-height: 1; }
.lbl { font-size: 11px; padding: 4px 6px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-strong); pointer-events: auto; cursor: pointer; }
.lbl:hover { border-color: var(--accent); color: var(--ink-strong); }
.slbl { font-family: var(--f-mono); font-size: 10px; padding: 2px 4px; background: rgba(5, 5, 5, 0.78); color: var(--ink); }
.mk { font-size: 12px; font-weight: 700; padding: 5px 8px; }
.mk.from { background: var(--ink-strong); color: var(--page); }
.mk.to { background: var(--ok); color: var(--ok-ink); }
.flbl {
  position: absolute; left: 0; top: 0; will-change: transform; pointer-events: auto; cursor: pointer;
  font-family: var(--f-mono); font-weight: 700; font-size: 12px; padding: 5px 9px; border-radius: 0;
  background: var(--ink); color: var(--page); border: none; transition: opacity .25s var(--m-ease);
}
.flbl[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.loading {
  position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--panel); border: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 10px;
  width: min(260px, calc(100vw - 48px));
}
.loading p { margin: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.pbar { height: 2px; background: var(--line-strong); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0%; background: var(--accent); }

@media (max-width: 720px) {
  .side { width: calc(100vw - 32px); max-height: 46%; }
  .keys { display: none; }
  .floors { top: auto; transform: none; flex-direction: row; align-items: flex-end; gap: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); }
  .bseg, .ftabs { flex-direction: row; }
  .btab { width: 52px; height: 44px; }
  .btab + .btab { margin-top: 0; margin-left: -1px; }
  .ftab { width: 44px; height: 44px; }
  .ftab + .ftab { margin-top: 0; margin-left: -1px; }
  .ftab .n { font-size: 16px; }
  .controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
  .zoom { bottom: calc(env(safe-area-inset-bottom, 0px) + 146px); }
  .zbtn { width: 44px; height: 44px; font-size: 22px; }
  .dock { gap: 8px; padding: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .chip, .ftab, .flbl { transition: none; }
}

/* ---------------- 사람 눈높이로 걷기 ---------------- */
.walkcard { gap: 8px; }
.walkcard .btn { padding: 11px 12px; font-size: 13px; }
.walkcard .btn:disabled { opacity: .45; cursor: default; }
body.walking .side, body.walking .floors, body.walking .zoom, body.walking .controls { display: none; }
body.walking #labels > :not(.wsign) { display: none; }
body.walking #stage canvas, body.walking #stage canvas:active { cursor: default; }
body.wlock #stage canvas, body.wlock #stage canvas:active { cursor: none; }
.w-top { top: calc(env(safe-area-inset-top, 0px) + 20px); left: calc(max(16px, env(safe-area-inset-left, 0px)) + 4px); display: flex; align-items: stretch; gap: 8px; max-width: calc(100vw - 130px); }
.w-top .btn { padding: 10px 14px; font-size: 13px; }
.w-where {
  display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13px; font-weight: 600; color: var(--ink-strong); background: var(--panel); border: 1px solid var(--line); padding: 0 12px;
}
/* 오른쪽 위 = 포털 닫기 단추(20px) 아래부터 */
.w-map { top: calc(env(safe-area-inset-top, 0px) + 84px); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); margin: 0; padding: 8px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 6px; pointer-events: none; }
.w-map figcaption { display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.w-map figcaption b { font-family: var(--f-sans); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink-strong); }
.w-map canvas { display: block; width: 192px; height: 104px; }
.w-floors { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; align-items: stretch; }
.w-floors .cap { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 6px; }
.w-floors .ftab { width: 52px; height: 46px; }
.w-bottom { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: grid; justify-items: center; gap: 10px; pointer-events: none; }
.w-bottom > * { pointer-events: auto; }
.w-hint { margin: 0; font-size: 13px; color: var(--ink); background: rgba(5, 5, 5, 0.78); border: 1px solid var(--line); padding: 8px 14px; white-space: nowrap; }
.w-stair { display: flex; }
.w-stair .btn { display: grid; justify-items: center; gap: 3px; padding: 11px 18px; font-size: 15px; background: var(--panel); }
.w-stair .btn + .btn { border-left: none; }
.w-stair .btn small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--muted); }
.w-stair .btn.hot { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.w-cam { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.w-cam .btn { padding: 10px 14px; font-size: 13px; background: var(--panel); }
.w-cross { left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }
.w-cross::before, .w-cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55); }
.w-cross::before { left: 10px; top: 0; width: 2px; height: 22px; }
.w-cross::after { left: 0; top: 10px; width: 22px; height: 2px; }
.wsign {
  position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; line-height: 1; pointer-events: none;
  font-size: 14px; font-weight: 700; letter-spacing: -0.01em; padding: 6px 10px 7px;
  background: rgba(17, 17, 17, 0.92); color: var(--ink-strong); border: 1px solid var(--line-strong); border-top: 2px solid var(--accent);
}
.w-fade { position: fixed; inset: 0; z-index: 6; background: var(--page); opacity: 0; pointer-events: none; transition: opacity .17s var(--m-ease); }
.w-fade.on { opacity: 1; }
/* 지도를 꾹 누를 때 차오르는 동그라미 */
.lpring { position: fixed; z-index: 4; left: 0; top: 0; width: 72px; height: 72px; margin: -36px 0 0 -36px; pointer-events: none; opacity: 0; }
.lpring circle { fill: rgba(5, 5, 5, 0.55); stroke: var(--accent); stroke-width: 4; stroke-dasharray: 189; stroke-dashoffset: 189; transform: rotate(-90deg); transform-origin: 50% 50%; }
.lpring text { fill: #fff; font: 700 12px var(--f-sans); text-anchor: middle; dominant-baseline: central; }
.lpring.go { animation: lpin .1s .12s linear forwards; }
.lpring.go circle { animation: lpfill .53s .12s linear forwards; }
@keyframes lpin { to { opacity: 1; } }
@keyframes lpfill { to { stroke-dashoffset: 0; } }
/* 창이 낮을 때(교실 TV 배율 150% ≈ 853×480): 왼쪽 안내판이 넘쳐 걷기 단추가 스크롤 밑으로 숨지 않게 줄임 */
@media (min-width: 721px) and (max-height: 620px) {
  .intro .eyebrow, .intro .keys, .walkcard .note { display: none; }
  .walkcard { padding: 10px; }
}
@media (max-width: 720px) {
  .w-map canvas { width: 150px; height: 82px; }

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  // 키는 페이지가 시작할 때 가장 먼저(capture) 받음: 걷는 중 Esc 는 preventDefault 해서
  // 이 페이지를 iframe 으로 띄운 포털이 "Esc = 지도 닫기"를 하지 않게 함 (포털은 defaultPrevented 면 안 닫음)
  let walkKey = null;
  window.addEventListener("keydown", (e) => { if (walkKey) walkKey(e); }, true);
  // 학교·사용자 PC 가 Windows 애니메이션 끔 상태라 분해가 뚝 끊겨 보여서, 이 지도는 항상 부드럽게 움직임
  const reduce = false;
  // 단독 페이지로 쓸 때는 window.SCHOOL3D_GLB / SCHOOL3D_ROOMS 로 파일 경로를 지정
  const GLB_URL = window.SCHOOL3D_GLB || null;
  const ROOMS_URL = window.SCHOOL3D_ROOMS || "rooms.json";
  const C = { route: 0x00e599, walker: 0xff5000 };
  const state = { sel: null, pick: null, from: null, to: null, route: null, zoomGoal: null, bld: "main", top: false };
  // 건물별 분해 상태 (target = 목표 0~1, p = 지금 값). 고른 건물만 아래 슬라이더로 벌림
  const EX = { main: { target: 0, p: 0 }, sol: { target: 0, p: 0 } };
  // 건물·층 정보 — rooms.json 의 buildings 로 덮어씀 (예전 파일이면 본관만)
  let BLD = [{ id: "main", name: "본관", animation: "explode", center_local: [0, 0, 0],
               floors: [1, 2, 3, 4].map((k) => ({ key: k, node: k + "F", label: k + "층" })) }];
  const LIFT = { main: (e) => 4 + 26 * e, sol: (e) => 3 + 15 * e };     // 분해할 때 시점이 따라 올라가는 높이
  const FLBL_POS = { main: [-49, 1.8, -12], sol: [-15, 1.8, 6] };        // 층 이름표 자리 (층 노드 기준)
  const floorNode = {}, floorInfo = {};                                  // 층 번호 → 노드 / {bld, label}
  let mixer = null, rooms = [], seats = [], nav = null;
  const acts = {};
  const roomLabels = [], floorLabels = [], seatLabels = [];
  const WING = { "북측동": "북측동", "남측동": "남측동", "연결동": "연결동", "동측계단": "동쪽", "북측돌출부": "북쪽 돌출부", "솔향관": "솔향관" };

  if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls) {
    $("ld-text").textContent = "3D 라이브러리를 불러오지 못했어요. 새로고침해 주세요.";
    return;
  }
  if (window.innerWidth < 720) $("routecard").open = false;

  const bldOf = (k) => (floorInfo[k] ? floorInfo[k].bld : (k > 10 ? "sol" : "main"));
  const bldName = (id) => (BLD.find((b) => b.id === id) || { name: "" }).name;
  const floorKeys = () => Object.keys(floorNode).map(Number);
  function floorTitle(k) {
    const lab = floorInfo[k] ? floorInfo[k].label : k + "층";
    return BLD.length > 1 ? bldName(bldOf(k)) + " " + lab : lab;
  }
  const lvShort = (n) => n.lv || (floorInfo[n.f] ? floorInfo[n.f].label : n.f + "층");

  // ---------------------------------------------------------------- 렌더러 / 장면
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $("stage").appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.05);
  sun.position.set(-70, 150, 95);
  sun.target.position.set(0, 30, 0);
  sun.castShadow = true;
  const sc = sun.shadow.camera;
  sc.left = -120; sc.right = 120; sc.top = 120; sc.bottom = -120; sc.near = 10; sc.far = 450;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.15;                     // 면 노멀 기준 그림자 보정 (작으면 벽에 빗금 무늬)
  scene.add(sun, sun.target);

  const gc = document.createElement("canvas");
  gc.width = gc.height = 256;
  const g2 = gc.getContext("2d");
  const grad = g2.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, "rgba(255,255,255,0.10)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g2.fillStyle = grad;
  g2.fillRect(0, 0, 256, 256);
  const disc = new THREE.Mesh(new THREE.PlaneGeometry(420, 420),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -2.44;                           // 운동장 높이 (차도 -0.6 보다 1.8m 아래, 솔향관 1층 = 운동장)
  scene.add(disc);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.45 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2.42;                         // 그림자 받는 판도 운동장 높이 (위에 두면 솔향관 1층 안에 떠 보임)
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------------------------------------------------------------- 시점 / 조작
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 12;
  controls.maxDistance = 900;
  controls.maxPolarAngle = THREE.MathUtils.degToRad(88);
  controls.zoomSpeed = 0.9;

  const HOME_OFF = new THREE.Vector3(-82, 88, 128);
  const easeOf = (p) => p * p * (3 - 2 * p);
  let campus = null, campusOn = true, fly = null;
  function viewFor(id) {
    const fit = Math.max(1, (16 / 9) / camera.aspect);
    const b = BLD.find((x) => x.id === id) || BLD[0];
    const c = b.center_local || [0, 0, 0];
    const ty = (LIFT[id] || LIFT.sol)(easeOf(EX[id].p));
    let tgt, k;
    if (id === "main") {
      const wide = campus && campusOn;               // 주변까지 보일 때는 운동장 쪽으로 조금 물러남
      tgt = new THREE.Vector3(wide ? -6 : 2, ty, wide ? 14 : 0);
      k = fit * (wide ? 1.2 : 1);
    } else {
      tgt = new THREE.Vector3(c[0], ty, c[2]);
      k = fit * 0.6;
    }
    return { tgt, pos: tgt.clone().add(HOME_OFF.clone().multiplyScalar(k)) };
  }
  function homeView() {
    const v = viewFor(state.bld);
    controls.target.copy(v.tgt);
    camera.position.copy(v.pos);
    state.zoomGoal = null;
    fly = null;
    controls.update();
  }
  function flyHome() {
    const v = viewFor(state.bld);
    fly = { t0: performance.now(), a: controls.target.clone(), b: v.tgt, pa: camera.position.clone(), pb: v.pos };
    state.zoomGoal = null;
  }
  // 노멀 없이 받은 GLB 는 면마다 노멀을 계산해 둠 — 없으면 그림자 보정(normalBias)이 안 먹어서 벽에 빗금 무늬(shadow acne)가 생김
  function flatNormals(o) {
    if (!o.isMesh || o.geometry.attributes.normal) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    g.computeVertexNormals();
    if (g !== o.geometry) o.geometry.dispose();
    o.geometry = g;
  }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();
  homeView();

  // ---------------------------------------------------------------- 분해 조작 (고른 건물)
  const slider = $("explode");
  slider.addEventListener("input", () => { EX[state.bld].target = slider.value / 100; });
  $("btn-split").addEventListener("click", () => { EX[state.bld].target = 1; });
  $("btn-merge").addEventListener("click", () => { EX[state.bld].target = 0; });
  $("btn-view").addEventListener("click", () => {
    state.top = false;
    $("btn-top").setAttribute("aria-pressed", "false");
    flyHome();
  });
  // 버튼 확대·축소: 목표 거리를 정하고 매 프레임 부드럽게 다가감
  function zoomBy(f) {
    const cur = state.zoomGoal != null ? state.zoomGoal : camera.position.distanceTo(controls.target);
    state.zoomGoal = THREE.MathUtils.clamp(cur * f, controls.minDistance, controls.maxDistance);
    fly = null;
  }
  $("zoom-in").addEventListener("click", () => zoomBy(0.75));
  $("zoom-out").addEventListener("click", () => zoomBy(1.33));
  controls.addEventListener("start", () => { fly = null; state.zoomGoal = null; });   // 손으로 돌리면 날아가던 것 멈춤

  // ---------------------------------------------------------------- 카메라 맞춤: 층·실·찍은 곳으로 날아가기
  const TOP_POLAR = 0.02;                                   // 평면 = 거의 바로 위
  const OBL_POLAR = THREE.MathUtils.degToRad(42);          // 층 보기 = 위에서 비스듬히
  const ROOM_POLAR = THREE.MathUtils.degToRad(48);
  const fbox = {};
  function floorBox(k) {                                    // 층 노드 기준 상자 (분해 애니는 층 노드만 움직이므로 한 번만 잼)
    if (fbox[k]) return fbox[k];
    const node = floorNode[k];
    node.updateWorldMatrix(true, true);
    const inv = node.matrixWorld.clone().invert(), m = new THREE.Matrix4();
    const box = new THREE.Box3(), b = new THREE.Box3();
    node.traverse((o) => {
      if (!o.isMesh) return;
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      box.union(b.copy(o.geometry.boundingBox).applyMatrix4(m.multiplyMatrices(inv, o.matrixWorld)));
    });
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    c.y = box.min.y + 1.0;                                  // 바닥 조금 위를 바라봄
    return (fbox[k] = { c, s });
  }
  const qq = new THREE.Quaternion(), ee = new THREE.Euler();
  function yawOf(node) { node.getWorldQuaternion(qq); return ee.setFromQuaternion(qq, "YXZ").y; }
  function curAz() { const o = camera.position.clone().sub(controls.target); return Math.atan2(o.x, o.z); }
  function offsetFor(polar, az, dist) {
    return new THREE.Vector3(Math.sin(polar) * Math.sin(az), Math.cos(polar), Math.sin(polar) * Math.cos(az)).multiplyScalar(dist);
  }
  // 화면에서 안내판·버튼에 안 가린 부분: 가로·세로 비율(fw, fh)과 그 가운데가 화면 가운데에서 어긋난 비율(cx 오른쪽+, cy 위쪽+)
  function freeArea() {
    const W = window.innerWidth, H = window.innerHeight;
    const side = document.querySelector(".side").getBoundingClientRect();
    let L = 0, R = W - 96, T = 0, B = H - 100;
    if (W > 720) {
      L = Math.min(W * 0.45, side.right + 12);
      R = Math.min(R, document.querySelector(".zoom").getBoundingClientRect().left - 12);   // 창이 낮으면 확대 묶음이 왼쪽 줄로 옴
    }
    else { R = W - 60; T = Math.min(H * 0.5, side.bottom + 8); B = H - 150; }
    return { fw: (R - L) / W, fh: (B - T) / H, cx: ((L + R) / 2 - W / 2) / W, cy: (H / 2 - (T + B) / 2) / H };
  }
  function fitDist(w, d) {                                  // 가로 w · 세로 d 가 안 가린 부분에 다 들어오는 거리
    const fa = freeArea();
    const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
    return Math.max(w / 2 / (th * fa.fw), d / 2 / (tv * fa.fh)) * 1.08;
  }
  const UP = new THREE.Vector3(0, 1, 0);
  function framed(tgt, pos) {                               // 보려는 곳이 안 가린 부분 가운데에 오게 피벗·카메라를 옆으로 옮김
    const fa = freeArea();
    const dist = pos.distanceTo(tgt);
    const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
    const fwd = tgt.clone().sub(pos).normalize();
    const right = fwd.clone().cross(UP).normalize(), up = right.clone().cross(fwd);
    const sh = right.multiplyScalar(-fa.cx * 2 * dist * th).add(up.multiplyScalar(-fa.cy * 2 * dist * tv));
    return { tgt: tgt.add(sh), pos: pos.add(sh) };
  }
  // dyn: 매 프레임 목표를 다시 계산 (분해 중이라 층이 움직여도 따라감)
  function flyDyn(dyn, dur) {
    state.zoomGoal = null;
    wz.log = 0;
    const d = dyn();
    fly = { t0: performance.now(), a: controls.target.clone(), pa: camera.position.clone(), b: d.tgt, pb: d.pos, dyn, dur: dur || 1000 };
  }
  function floorView(k) {                                   // 층 하나가 화면에 꽉 차게 (평면이면 층이 화면에 반듯하게)
    const node = floorNode[k], fb = floorBox(k), top = state.top, az = curAz();
    const r = Math.hypot(fb.s.x, fb.s.z);
    return () => {
      node.updateWorldMatrix(true, false);                  // 분해 애니가 방금 옮긴 위치로
      const tgt = node.localToWorld(fb.c.clone());
      const pos = top ? offsetFor(TOP_POLAR, yawOf(node), fitDist(fb.s.x, fb.s.z))
                      : offsetFor(OBL_POLAR, az, fitDist(r * 0.9, r * 0.7));
      return framed(tgt, pos.add(tgt));
    };
  }
  function bldTopView() {                                   // 층을 안 골랐을 때 평면: 건물 전체
    const b = BLD.find((x) => x.id === state.bld) || BLD[0];
    const ks = b.floors.map((f) => f.key).filter((k) => floorNode[k]);
    const box = new THREE.Box3(), c = new THREE.Vector3(), s = new THREE.Vector3();
    return () => {
      box.makeEmpty();
      ks.forEach((k) => box.expandByObject(floorNode[k]));
      box.getCenter(c); box.getSize(s);
      const tgt = new THREE.Vector3(c.x, box.min.y, c.z);
      return framed(tgt, offsetFor(TOP_POLAR, 0, fitDist(s.x, s.z) + s.y).add(tgt));
    };
  }
  function roomView(i) {                                    // 실 하나 가까이 (자리 이름표가 보이는 거리)
    const r = rooms[i], node = floorNode[r.floor], top = state.top, az = curAz();
    const p = new THREE.Vector3().fromArray(r.pos_local);
    p.y -= 1.0;
    return () => {
      node.updateWorldMatrix(true, false);
      const tgt = node.localToWorld(p.clone());
      return framed(tgt, offsetFor(top ? TOP_POLAR : ROOM_POLAR, top ? yawOf(node) : az, 30).add(tgt));
    };
  }
  function roomClick(i) {
    if (state.pick) { const w = state.pick; setPick(null); setEnd(w, i); return; }
    if (state.sel !== rooms[i].floor) select(rooms[i].floor, false);
    flyDyn(roomView(i), 1000);
  }
  function focusAt(p) {                                     // 더블클릭한 곳을 가운데로 + 확대
    const off = camera.position.clone().sub(controls.target);
    const nd = THREE.MathUtils.clamp(off.length() * 0.45, 18, controls.maxDistance);
    const tgt = p.clone();
    flyDyn(() => framed(tgt.clone(), tgt.clone().add(off.clone().setLength(nd))), 800);
  }
  $("btn-top").addEventListener("click", () => {

  // 휠 = 마우스가 가리킨 곳을 향해 확대·축소 (그곳이 화면에서 제자리에 있도록). 손가락 두 개 벌리기는 원래대로
  const wz = { log: 0, p: null };
  const wray = new THREE.Raycaster(), wndc = new THREE.Vector2();
  function pickHit(cx, cy) {
    wndc.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
    wray.setFromCamera(wndc, camera);
    const objs = visibleFloors().map((f) => floorNode[f]).filter(Boolean);
    if (campus && campusOn) objs.push(campus);
    return (objs.length && wray.intersectObjects(objs, true)[0]) || null;
  }
  function pickPoint(cx, cy) {
    const hit = pickHit(cx, cy);
    return hit ? hit.point : null;
  }
  function onWheel(e) {
    e.preventDefault();
    e.stopPropagation();                                    // OrbitControls 의 가운데 확대는 막음
    if (WK.on) return;                                      // 걷는 중에는 휠 확대 없음
    fly = null;
    state.zoomGoal = null;
    const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    wz.log = THREE.MathUtils.clamp(wz.log + dy * 0.0012, -1.5, 1.5);
    wz.p = pickPoint(e.clientX, e.clientY) || controls.target.clone();
  }
  $("stage").addEventListener("wheel", onWheel, { capture: true, passive: false });
  $("labels").addEventListener("wheel", onWheel, { passive: false });   // 이름표 위에서 굴려도 같게
  function wheelStep() {
    if (Math.abs(wz.log) < 1e-3 || !wz.p) { wz.log = 0; return; }
    const step = wz.log * 0.22;
    wz.log -= step;
    const dist = camera.position.distanceTo(controls.target);
    let f = Math.exp(step);
    f = THREE.MathUtils.clamp(dist * f, controls.minDistance, controls.maxDistance) / dist;
    if (Math.abs(f - 1) < 1e-5) { wz.log = 0; return; }
    controls.target.sub(wz.p).multiplyScalar(f).add(wz.p);
    camera.position.sub(wz.p).multiplyScalar(f).add(wz.p);
  }

  // ---------------------------------------------------------------- 모델
  function progress(pct) {

  function b64ToBuf(text) {
    const bin = atob(text.trim());
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  }
  async function fetchModel() {
    const res = await fetch("buwon_floors.glb.txt");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const total = 3468828;
    let text;
    if (res.body && res.body.getReader) {
      const reader = res.body.getReader();
      const parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        progress(Math.min(99, Math.round((got / total) * 100)));
      }
      const all = new Uint8Array(got);
      let o = 0;
      parts.forEach((p) => { all.set(p, o); o += p.length; });
      text = new TextDecoder().decode(all);
    } else {
      text = await res.text();
    }
    return b64ToBuf(text);
  }

  // ---------------------------------------------------------------- 주변(부지·운동장·정문·나무) — 건물을 띄운 뒤 따로 불러옴

          .then((t) => new Promise((res, rej) => loader.parse(b64ToBuf(t), "", res, rej)));
    p.then((g) => {
      campus = g.scene;
      campus.traverse((o) => {
        if (!o.isMesh) return;
        flatNormals(o);
        const see = /glass|fence/.test(o.material.name);
        if (see) o.material.depthWrite = false;
        o.castShadow = !see;
        o.receiveShadow = true;
      });
      campus.visible = campusOn || WK.on;
      scene.add(campus);
      $("btn-campus").hidden = false;
      walkDataReset();                                // 걷기용 격자에 주변(바깥 땅)도 넣도록 다시 만듦
      if (state.bld === "main" && EX.main.p < 0.02 && state.zoomGoal == null && !fly) homeView();
    }).catch((e) => console.warn("주변 모델을 불러오지 못했어요", e));

  function mkLabel(cls, text, hidden) {

  const loader = new THREE.GLTFLoader();

  Promise.all([modelP, fetch(ROOMS_URL).then((r) => r.json())]).then(([gltf, meta]) => {

  // ---------------------------------------------------------------- 실 이름 (같은 층에 같은 이름이면 동 이름을 붙임)

  // ---------------------------------------------------------------- 층 보이기 / 흐리게

  // skip(e) 가 true 인 간선은 빼고 찾음 (건물 사이: 구름다리로만 / 바깥으로만)
  function dijkstra(src, dst, skip) {
    const n = nav.nodes.length;
    const adj = Array.from({ length: n }, () => []);
    nav.edges.forEach((e, k) => { if (skip && skip(e)) return; adj[e[0]].push([e[1], e[2], k]); adj[e[1]].push([e[0], e[2], k]); });
    const dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), via = new Int32Array(n).fill(-1);
    const done = new Uint8Array(n);
    dist[src] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < n; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u < 0 || u === dst) break;
      done[u] = 1;
      for (const [v, w, k] of adj[u]) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; via[v] = k; }
    }
    if (!isFinite(dist[dst])) return null;
    const path = [], edges = [];
    for (let v = dst; v >= 0; v = prev[v]) { path.unshift(v); if (via[v] >= 0) edges.unshift(via[v]); }
    return { path, edges, dist: dist[dst] };
  }

  // 경로(초록) 위에 걷는 사람(주황)이 항상 보이도록: 둘 다 투명 패스 + depthTest 끔, 렌더 순서로 위아래 결정
  const ROUTE_MAT = new THREE.MeshBasicMaterial({ color: C.route, transparent: true, opacity: 0.9, depthTest: false, depthWrite: false });
  const WALK_MAT = new THREE.MeshBasicMaterial({ color: C.walker, transparent: true, opacity: 1, depthTest: false, depthWrite: false });
  const HALO_MAT = new THREE.MeshBasicMaterial({ color: C.walker, transparent: true, opacity: 0.35, depthTest: false, depthWrite: false });
  const RING_MAT = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, depthTest: false, depthWrite: false });
  const cylGeo = new THREE.CylinderGeometry(0.3, 0.3, 1, 10, 1, true);
  cylGeo.translate(0, 0.5, 0);
  const jointGeo = new THREE.SphereGeometry(0.3, 10, 8);
  const routeGroup = new THREE.Group();
  scene.add(routeGroup);
  const walker = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.SphereGeometry(1.15, 20, 14), RING_MAT);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.95, 20, 14), WALK_MAT);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(1.9, 20, 14), HALO_MAT);
  halo.renderOrder = 20; ring.renderOrder = 21; core.renderOrder = 22;
  walker.add(halo, ring, core);
  walker.visible = false;
  scene.add(walker);
  const segs = [], joints = [];
  const mkFrom = mkLabel("mk from", "출발", true), mkTo = mkLabel("mk to", "도착", true);

  function nodeOf(i) { return nav.nodes.findIndex((n) => n.r === i); }
  // 건물 사이를 바깥으로 잇는 간선 (본관 통로 ↔ 솔향관 현관)
  const crossOut = (e) => e[3] === "out" && bldOf(nav.nodes[e[0]].f) !== bldOf(nav.nodes[e[1]].f);
  function cost(res) {
    let walk = 0, nStair = 0;
    res.edges.forEach((k) => { const e = nav.edges[k]; if (e[3] === "stair") nStair++; else walk += e[2]; });
    return { m: Math.round(walk + nStair * 7), min: Math.max(1, Math.round((walk / 1.2 + nStair * 22) / 60)) };
  }
  state.via = "bridge";                               // 건물 사이 기본 = 구름다리 (실내)
  $("rt-via").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-via]");
    if (!b) return;
    state.via = b.dataset.via;
    route();
  });

  function route() {
    const steps = $("rt-steps");
    state.route = null;
    steps.hidden = true;
    $("rt-via").hidden = true;
    $("rt-sum").textContent = "";
    $("rt-note").hidden = false;
    $("rt-note").textContent = "출발과 도착을 고르거나, 찍기를 누른 뒤 건물에서 실을 누르세요.";

        const cross = bldOf(rooms[state.from].floor) !== bldOf(rooms[state.to].floor);
        // 건물 사이면 두 길을 다 계산: 2층 구름다리로 / 바깥(본관 통로 → 솔향관 1.5층 현관)으로

  function describe(res) {

    const P = res.path;

  // ================================================================ 사람 눈높이로 걷기

  const walkFog = new THREE.Fog(WALK_SKY, 30, 150);

    hemi.intensity = LIGHT.hemi;

  }
  const cvs = renderer.domElement;

  function walkDataReset() {
    if (!CG) return;
    if (SIGNS) SIGNS.forEach((s) => s.el.remove());
    if (CEIL) { scene.remove(CEIL); CEIL.geometry.dispose(); }
    CG = NP = ADJ = SIGNS = CEIL = null;
    MM.cache = {};
    if (WK.on) buildWalkData();
  }
  function buildWalkData() {
    doorGeom();
    buildGrid();
    buildNav();
    buildCeil();
    buildSigns();
  }

  // ---------------------------------------------------------------- 격자
  function buildGrid() {
    scene.updateMatrixWorld(true);
    const meshes = [];
    floorKeys().forEach((k) => floorNode[k].traverse((o) => { if (o.isMesh && !o.userData.door) meshes.push([o, k]); }));   // 문짝은 충돌 없음 (다가가면 열림)
    if (campus) campus.traverse((o) => { if (o.isMesh) meshes.push([o, 0]); });
    let total = 0;
    meshes.forEach(([m]) => { const g = m.geometry; total += Math.floor((g.index ? g.index.count : g.attributes.position.count) / 3); });
    const T = new Float32Array(total * 9), F = new Uint8Array(total), FK = new Uint8Array(total);
    const Y0 = new Float32Array(total), Y1 = new Float32Array(total);
    let n = 0, bx0 = Infinity, bx1 = -Infinity, bz0 = Infinity, bz1 = -Infinity;     // 격자 범위 = 건물 + 45m
    meshes.forEach(([m, fk]) => {
      const g = m.geometry, pa = g.attributes.position, ia = g.index ? g.index.array : null;
      const arr = pa.isInterleavedBufferAttribute ? null : pa.array, e = m.matrixWorld.elements;
      const see = /glass|fence/.test(m.material.name || "");
      const cnt = ia ? ia.length : pa.count;
      for (let i = 0; i + 2 < cnt; i += 3) {
        const o = n * 9;
        for (let q = 0; q < 3; q++) {
          const vi = ia ? ia[i + q] : i + q;
          const x = arr ? arr[vi * 3] : pa.getX(vi), y = arr ? arr[vi * 3 + 1] : pa.getY(vi), z = arr ? arr[vi * 3 + 2] : pa.getZ(vi);
          T[o + q * 3] = e[0] * x + e[4] * y + e[8] * z + e[12];
          T[o + q * 3 + 1] = e[1] * x + e[5] * y + e[9] * z + e[13];
          T[o + q * 3 + 2] = e[2] * x + e[6] * y + e[10] * z + e[14];

        }

      }
    });

  // 삼각형을 높이 띠 [lo, hi] 로 잘라 위에서 본 다각형 → PA (문 위 상인방처럼 띠 밖 부분은 길을 막지 않게)
  const PA = new Float64Array(30), PB = new Float64Array(30);

      const ina = above ? ay >= y0 : ay <= y0, inb = above ? by >= y0 : by <= y0;

  }

  // 점에서 PA 다각형(위에서 본 모양)까지 가장 가까운 점

      if (d < best) { best = d; CP.x = qx; CP.z = qz; }
      const cr = ex * (pz - az) - ez * (px - ax);
      if (Math.abs(cr) > 1e-7) { const sg = cr > 0 ? 1 : -1; if (!sign) sign = sg; else if (sg !== sign) inside = false; }
    }
    CP.d = Math.sqrt(best);
    CP.inside = inside && sign !== 0;
  }
  // 발 높이 feet 에서 반지름 r 안에 걸리는 벽을 하나씩 돌며 fn(삼각형) — 같은 삼각형은 한 번만
  function eachWall(x, z, feet, r, fn) {
    const G = CG, lo = feet + BAND_LO, hi = feet + BAND_HI;
    const i0 = Math.max(0, cellI(x - r)), i1 = Math.min(G.nx - 1, cellI(x + r));
    const j0 = Math.max(0, cellJ(z - r)), j1 = Math.min(G.nz - 1, cellJ(z + r));
    G.mark++;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      for (let q = G.head[j * G.nx + i], qe = G.head[j * G.nx + i + 1]; q < qe; q++) {
        const t = G.items[q];
        if (G.stamp[t] === G.mark) continue;
        G.stamp[t] = G.mark;
        if (!(G.F[t] & 2) || G.Y1[t] <= lo || G.Y0[t] >= hi) continue;
        const o = t * 9, T = G.T;
        if (Math.min(T[o], T[o + 3], T[o + 6]) > x + r || Math.max(T[o], T[o + 3], T[o + 6]) < x - r ||
            Math.min(T[o + 2], T[o + 5], T[o + 8]) > z + r || Math.max(T[o + 2], T[o + 5], T[o + 8]) < z - r) continue;
        const n = bandPoly(t, lo, hi);
        if (n < 2) continue;
        polyClosest(x, z, n);
        if (fn(t) === false) return;
      }
    }
  }
  function minWallDist(x, z, feet, r) {
    let m = Infinity;
    eachWall(x, z, feet, r, () => { m = CP.inside ? 0 : Math.min(m, CP.d); return m > 0; });
    return m;
  }
  // 벽에 겹치면 밀어냄 (ox, oz = 움직이기 전 자리: 벽 면 위에 딱 걸렸을 때 어느 쪽으로 밀지)
  function pushOut(p, feet, ox, oz) {
    for (let it = 0; it < 3; it++) {
      let moved = false;
      eachWall(p.x, p.z, feet, RAD, (t) => {
        if (!CP.inside && CP.d >= RAD) return;
        let dx = p.x - CP.x, dz = p.z - CP.z, d = Math.hypot(dx, dz);
        if (CP.inside || d < 1e-5) { dx = ox - p.x; dz = oz - p.z; d = Math.hypot(dx, dz); }
        if (d < 1e-6) return;
        const k = CP.inside ? (CP.d + RAD) / d : RAD / d;
        p.x = (CP.inside ? p.x : CP.x) + dx * k;
        p.z = (CP.inside ? p.z : CP.z) + dz * k;
        moved = true;
      });
      if (!moved) break;
    }
  }
  // a → b 를 곧장 걸어갈 수 있나 (벽·낭떠러지 없이)
  function clearLine(a, b) {
    const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz), n = Math.max(1, Math.ceil(L / 0.2));
    let feet = a.y;
    for (let k = 1; k <= n; k++) {
      const x = a.x + (dx * k) / n, z = a.z + (dz * k) / n;
      const g = groundAt(x, z, feet + STEP_UP);
      if (g < feet - DROP) return false;
      feet = g;
      if (minWallDist(x, z, feet, RAD * 0.9) < RAD * 0.9) return false;
    }
    return Math.abs(feet - b.y) < 0.5;
  }
  // 광선 o + d·t 를 격자 칸 따라 (2D DDA) → 처음 맞은 삼각형. skip 비트가 있는 삼각형(유리 등)은 지나침
  function rayGrid(o, d, maxT, skip) {
    const G = CG, T = G.T;
    let i = cellI(o.x), j = cellJ(o.z);
    if (i < 0 || j < 0 || i >= G.nx || j >= G.nz) return null;
    const si = d.x > 0 ? 1 : -1, sj = d.z > 0 ? 1 : -1;
    const tdx = Math.abs(d.x) > 1e-9 ? G.cs / Math.abs(d.x) : Infinity, tdz = Math.abs(d.z) > 1e-9 ? G.cs / Math.abs(d.z) : Infinity;
    let tmx = Math.abs(d.x) > 1e-9 ? (G.x0 + (i + (si > 0 ? 1 : 0)) * G.cs - o.x) / d.x : Infinity;
    let tmz = Math.abs(d.z) > 1e-9 ? (G.z0 + (j + (sj > 0 ? 1 : 0)) * G.cs - o.z) / d.z : Infinity;
    let best = maxT, hit = -1, tIn = 0;
    G.mark++;
    while (i >= 0 && j >= 0 && i < G.nx && j < G.nz && tIn <= best) {
      for (let q = G.head[j * G.nx + i], qe = G.head[j * G.nx + i + 1]; q < qe; q++) {
        const t = G.items[q];
        if (G.stamp[t] === G.mark) continue;
        G.stamp[t] = G.mark;
        if (G.F[t] & skip) continue;
        const k = t * 9;
        const e1x = T[k + 3] - T[k], e1y = T[k + 4] - T[k + 1], e1z = T[k + 5] - T[k + 2];
        const e2x = T[k + 6] - T[k], e2y = T[k + 7] - T[k + 1], e2z = T[k + 8] - T[k + 2];
        const px = d.y * e2z - d.z * e2y, py = d.z * e2x - d.x * e2z, pz = d.x * e2y - d.y * e2x;
        const det = e1x * px + e1y * py + e1z * pz;
        if (Math.abs(det) < 1e-12) continue;
        const inv = 1 / det, sx = o.x - T[k], sy = o.y - T[k + 1], sz = o.z - T[k + 2];
        const u = (sx * px + sy * py + sz * pz) * inv;
        if (u < 0 || u > 1) continue;
        const qx = sy * e1z - sz * e1y, qy = sz * e1x - sx * e1z, qz = sx * e1y - sy * e1x;
        const vv = (d.x * qx + d.y * qy + d.z * qz) * inv;
        if (vv < 0 || u + vv > 1) continue;
        const tt = (e2x * qx + e2y * qy + e2z * qz) * inv;
        if (tt > 1e-4 && tt < best) { best = tt; hit = t; }
      }
      if (tmx < tmz) { tIn = tmx; tmx += tdx; i += si; } else { tIn = tmz; tmz += tdz; j += sj; }
      if (hit >= 0 && best <= tIn) break;
    }
    return hit >= 0 ? { t: best, tri: hit } : null;
  }

  // ---------------------------------------------------------------- 길찾기 점(발 높이) · 천장 · 표지판
  function buildNav() {
    NP = nav.nodes.map((nd) => {
      const p = new THREE.Vector3(nd.p[0], nd.p[1] - 0.9, nd.p[2]);
      if (floorNode[nd.f]) floorNode[nd.f].localToWorld(p);
      const g = groundAt(p.x, p.z, p.y + 0.3);
      if (g > p.y - 1) p.y = g;
      return p;
    });
    ADJ = nav.nodes.map(() => []);
    nav.edges.forEach((e, k) => { ADJ[e[0]].push([e[1], k]); ADJ[e[1]].push([e[0], k]); });
  }
  // 웹 모델엔 지붕이 없어서, 위에 아무것도 없는 바닥 위에는 그 층 벽 꼭대기 높이로 천장을 덮음 (걷는 동안만)
  function buildCeil() {
    const G = CG, T = G.T, pos = [], w = new THREE.Vector3();
    floorKeys().forEach((k) => {
      const lvl = floorNode[k].getWorldPosition(w).y;
      let top = -Infinity;
      for (let t = 0; t < G.n; t++) if (G.FK[t] === k && (G.F[t] & 2) && !(G.F[t] & 4)) top = Math.max(top, G.Y1[t]);
      if (!isFinite(top) || top < lvl + 2) return;
      const cy = top - 0.02;
      for (let t = 0; t < G.n; t++) {
        if (G.FK[t] !== k || !(G.F[t] & 1) || Math.abs(G.Y0[t] - lvl) > 0.03 || Math.abs(G.Y1[t] - lvl) > 0.03) continue;
        const o = t * 9, mx = (T[o] + T[o + 3] + T[o + 6]) / 3, mz = (T[o + 2] + T[o + 5] + T[o + 8]) / 3;
        if (groundAt(mx, mz, cy + 0.6) > lvl + 1.0) continue;    // 위에 윗층 바닥·계단이 있으면 그대로
        pos.push(T[o], cy, T[o + 2], T[o + 6], cy, T[o + 8], T[o + 3], cy, T[o + 5]);
      }
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    let wm = null;
    floorNode[floorKeys()[0]].traverse((o) => { if (!wm && o.isMesh && o.material.name === "w_wall") wm = o.material; });
    CEIL = new THREE.Mesh(geo, wm ? wm.clone() : new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
    CEIL.visible = WK.on;
    scene.add(CEIL);
  }
  // 실 이름 표지판: 문 위(2.45m) 복도 쪽 벽 바로 앞에.
  // 문 점(pt)은 문턱 안쪽에 있어서, 그 문 점과 이어진 복도 점에서 문 쪽으로 광선을 쏴 처음 맞는 벽(문 위 벽)에 붙임
  function buildSigns() {
    const dir = new THREE.Vector3();
    SIGNS = [];
    rooms.forEach((r, i) => {
      const ni = nodeOf(i);
      if (ni < 0) return;
      const room = NP[ni];
      let door = -1, bd = Infinity;
      ADJ[ni].forEach(([o]) => {
        if (nav.nodes[o].k === "room") return;
        const d = NP[o].distanceTo(room);
        if (d < bd) { bd = d; door = o; }
      });
      let pos = null;
      if (door >= 0 && bd > 0.3) {
        // 바깥(복도) 기준점: 문 점이 pt 면 그와 이어진 복도·다른 점, 아니면 문 점 자신
        let src = door;
        if (nav.nodes[door].k === "pt") {
          let od = Infinity;
          ADJ[door].forEach(([o]) => {
            if (o === ni || nav.nodes[o].k === "room" || Math.abs(NP[o].y - room.y) > 0.5) return;
            const d = Math.hypot(NP[o].x - NP[door].x, NP[o].z - NP[door].z) + (nav.nodes[o].k === "corr" ? 0 : 2);
            if (d < od && d < 8) { od = d; src = o; }
          });
        }
        const a = NP[src].clone();
        a.y = room.y + 2.45;
        const via = src === door ? room : NP[door];
        dir.set(via.x - a.x, 0, via.z - a.z);
        const L = dir.length();
        if (L > 0.05) {
          dir.normalize();
          const h = rayGrid(a, dir, L + 1.5, 4);
          if (h && h.t > 0.3) pos = a.addScaledVector(dir, h.t - 0.12);
        }
      }
      if (!pos) {
        pos = room.clone();
        pos.y += 2.45;
      }
      const el = mkLabel("wsign", roomName(i, false), true);
      SIGNS.push({ el, pos, feet: room.y, seen: false, chk: 0 });
    });
  }

  // ---------------------------------------------------------------- 자동문 (유리문·양문)
  // 문짝에서 DOOR_NEAR 안으로 오면 내 반대쪽으로 열리고, DOOR_FAR 밖으로 멀어지면 닫힘. 문짝은 충돌 격자에 안 넣음
  const DOOR_OPEN = 1.62, DOOR_NEAR = 2.2, DOOR_FAR = 3.0, DQ = new THREE.Quaternion(), DY = new THREE.Vector3(0, 1, 0);
  function doorsClose() {
    DOORS.forEach((d) => { d.a = 0; d.want = false; d.obj.quaternion.copy(d.q0); });
  }
  // 닫힌 문짝의 경첩·방향 (걷는 동안은 분해 0 이라 그대로)
  function doorGeom() {
    doorsClose();
    scene.updateMatrixWorld(true);
    DOORS.forEach((d) => {
      d.obj.getWorldPosition(d.H);
      d.U.set(1, 0, 0).transformDirection(d.obj.matrixWorld);
      d.U.y = 0;
      d.U.normalize();
      d.N.set(d.U.z, 0, -d.U.x);                                  // 로컬 Y 축으로 + 만큼 돌리면 문짝 끝이 N 쪽으로 감
    });
  }
  function doorsFrame(dt) {
    const px = WK.pos.x, pz = WK.pos.z;
    for (const d of DOORS) {
      if (Math.abs(WK.ground - d.H.y) > 1.3) d.want = false;
      else {
        const rx = px - d.H.x, rz = pz - d.H.z;
        const s = THREE.MathUtils.clamp(rx * d.U.x + rz * d.U.z, 0, d.w);
        const dist = Math.hypot(rx - d.U.x * s, rz - d.U.z * s);
        if (dist < DOOR_NEAR) d.want = true;
        else if (dist > DOOR_FAR) d.want = false;
        // 닫혀 있는 동안은 열 쪽을 계속 고름: 내가 있는 쪽 반대로 밀어서 열림
        if (Math.abs(d.a) < 0.05) d.side = (rx - d.U.x * d.w * 0.5) * d.N.x + (rz - d.U.z * d.w * 0.5) * d.N.z > 0 ? -1 : 1;
      }
      const goal = d.want ? d.side * DOOR_OPEN : 0;
      if (d.a === goal) continue;
      d.a += (goal - d.a) * (1 - Math.exp(-dt * (d.want ? 9 : 4.5)));
      if (Math.abs(goal - d.a) < 0.003) d.a = goal;
      d.obj.quaternion.copy(d.q0).multiply(DQ.setFromAxisAngle(DY, d.a));
    }
  }

  // ---------------------------------------------------------------- 움직이기
  const P = new THREE.Vector3();
  function moveBy(dx, dz) {
    const n = Math.max(1, Math.ceil(Math.hypot(dx, dz) / 0.08));
    for (let k = 0; k < n; k++) {
      P.set(WK.pos.x + dx / n, 0, WK.pos.z + dz / n);
      pushOut(P, WK.ground, WK.pos.x, WK.pos.z);
      const g = groundAt(P.x, P.z, WK.ground + STEP_UP);
      if (g < WK.ground - DROP) return false;                    // 바닥이 없거나 낭떠러지 → 멈춤
      WK.pos.x = P.x; WK.pos.z = P.z; WK.ground = g;
    }
    return true;
  }
  const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  const yawTo = (a, b) => Math.atan2(-(b.x - a.x), -(b.z - a.z));
  function clampPitch() { WK.pitch = THREE.MathUtils.clamp(WK.pitch, -1.35, 1.35); }

  // 목적지 표시 (바닥의 주황 동그라미)
  const goalMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(C.walker).convertSRGBToLinear(), transparent: true, opacity: 0.95,
                                                depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const goal = new THREE.Group();
  const goalRing = new THREE.Mesh(new THREE.RingGeometry(0.26, 0.36, 40), goalMat);
  const goalDot = new THREE.Mesh(new THREE.CircleGeometry(0.09, 20), goalMat);
  goalRing.rotation.x = goalDot.rotation.x = -Math.PI / 2;
  goal.add(goalRing, goalDot);
  goal.visible = false;
  scene.add(goal);

  function nearNodes(p, n) {
    const out = [];
    NP.forEach((q, i) => { if (Math.abs(q.y - p.y) < 1.0) out.push([Math.hypot(q.x - p.x, q.z - p.z), i]); });
    return out.sort((a, b) => a[0] - b[0]).slice(0, n).map((x) => x[1]);
  }
  function setPath(pts) {
    WK.path = pts;
    WK.pi = 0;
    WK.stuckT = 0;
    WK.stuckP.copy(WK.pos);
    let L = 0, prev = WK.pos;
    pts.forEach((p) => { L += Math.hypot(p.x - prev.x, p.z - prev.z); prev = p; });
    WK.vmax = THREE.MathUtils.clamp(L / 4.5, 2.2, 5.5);
    goal.position.copy(pts[pts.length - 1]);
    goal.position.y += 0.03;
    goal.visible = true;
    WK.goalAt = performance.now();
  }
  function stopPath() {
    WK.path = null;
    WK.v = 0;
    goal.visible = false;
  }
  // 누른 곳까지: 곧장 갈 수 있으면 곧장, 아니면 길찾기 점을 따라 (계단을 지나야 하면 계단 앞에서 멈추고 위/아래층 단추)
  function planWalk(tgt) {
    WK.stairGoal = 0;
    const s = new THREE.Vector3(WK.pos.x, WK.ground, WK.pos.z);
    if (Math.abs(tgt.y - s.y) < 0.6 && clearLine(s, tgt)) { setPath([tgt]); return; }
    const a = nearNodes(s, 6).find((i) => clearLine(s, NP[i]));
    const b = nearNodes(tgt, 6).find((i) => clearLine(NP[i], tgt));
    const r = a != null && b != null ? dijkstra(a, b) : null;
    if (!r) { setPath([tgt]); return; }                          // 길이 없으면 곧장 (막히면 그 앞에서 멈춤)
    let pts = [];
    for (let k = 0; k < r.path.length; k++) {
      if (k > 0 && nav.edges[r.edges[k - 1]][3] === "stair") {
        WK.stairGoal = NP[r.path[k]].y > NP[r.path[k - 1]].y ? 1 : -1;
        break;
      }
      pts.push(NP[r.path[k]].clone());
    }
    if (!WK.stairGoal) pts.push(tgt);
    // 앞쪽 점이 바로 보이면 그 앞의 점들은 건너뜀 (복도에서 지그재그 안 하게)
    for (let k = Math.min(pts.length - 1, 4); k > 0; k--) {
      if (Math.hypot(pts[k].x - s.x, pts[k].z - s.z) < 30 && clearLine(s, pts[k])) { pts = pts.slice(k); break; }
    }
    setPath(pts);
  }
  function tapWalk(cx, cy) {
    if (!CG) return;
    wndc.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
    wray.setFromCamera(wndc, camera);
    const o = wray.ray.origin, d = wray.ray.direction;
    const h = rayGrid(o, d, 250, 4);                             // 유리·울타리 너머를 누를 수 있게 지나침
    if (!h || (CG.F[h.tri] & 8)) return;                         // 하늘·천장
    const p = o.clone().addScaledVector(d, h.t);
    const tgt = new THREE.Vector3();
    if (CG.F[h.tri] & 1) {
      tgt.set(p.x, groundAt(p.x, p.z, p.y + 0.05), p.z);
      // 책상 위처럼 발보다 조금 높은 면 → 그 아래 바닥으로 (가다가 책상 앞에서 멈춤)
      if (tgt.y > WK.ground + STEP_UP && tgt.y < WK.ground + 1.3) tgt.y = groundAt(p.x, p.z, WK.ground + STEP_UP);
    } else {
      // 벽·책상 옆면 → 그 바로 앞
      const hx = p.x - WK.pos.x, hz = p.z - WK.pos.z, L = Math.hypot(hx, hz);
      if (L < 0.6) return;
      const k = (L - 0.45) / L;
      tgt.set(WK.pos.x + hx * k, 0, WK.pos.z + hz * k);
      tgt.y = groundAt(tgt.x, tgt.z, Math.max(WK.ground, p.y) + STEP_UP);
    }
    if (!isFinite(tgt.y)) return;
    planWalk(tgt);
  }
  function followPath(dt) {
    const pts = WK.path, tgt = pts[WK.pi];
    const dx = tgt.x - WK.pos.x, dz = tgt.z - WK.pos.z, d = Math.hypot(dx, dz);
    const last = WK.pi === pts.length - 1;
    if (d < (last ? 0.08 : 0.4)) {
      if (!last) { WK.pi++; return; }
      stopPath();
      if (WK.stairGoal) { WK.stair = -2; whereNow(); }        // 계단 단추를 바로 띄움
      return;
    }
    let rem = d;
    for (let k = WK.pi + 1; k < pts.length; k++) rem += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].z - pts[k - 1].z);
    const want = Math.min(WK.vmax, Math.sqrt(2 * 3.2 * rem) + 0.15);
    WK.v += THREE.MathUtils.clamp(want - WK.v, -8 * dt, 4.5 * dt);
    const step = Math.min(d, WK.v * dt);
    moveBy((dx / d) * step, (dz / d) * step);
    // 가는 쪽으로 천천히 고개를 돌림 (손으로 둘러보는 중이면 그대로)
    if (d > 0.6 && !WK.down && performance.now() - WK.dragAt > 600) {
      WK.yaw += angDiff(Math.atan2(-dx, -dz), WK.yaw) * Math.min(1, dt * 3);
      WK.pitch += (Math.min(0, WK.pitch) * 0.6 - WK.pitch) * Math.min(1, dt * 2);
    }
    WK.stuckT += dt;
    if (WK.stuckT > 0.6) {
      if (Math.hypot(WK.pos.x - WK.stuckP.x, WK.pos.z - WK.stuckP.z) < 0.12) stopPath();   // 막혀서 못 감
      WK.stuckT = 0;
      WK.stuckP.copy(WK.pos);
    }
  }

  // ---------------------------------------------------------------- 지금 위치 · 층 · 계단
  function whereNow() {
    let best = -1, bd = Infinity, st = -1, sd = Infinity;

      WK.lvLab = txt;
      // 어느 실·복도인지는 벽에 안 가려 보이는 가장 가까운 점으로 (교실 안이면 벽 너머 복도 점이 더 가까워도 교실)

  // ---------------------------------------------------------------- 표지판 · 작은 평면
  const sv = new THREE.Vector3(), sdir = new THREE.Vector3();
  function drawSigns(t) {
    const eye = camera.position, cand = [];

      s.show = false;

      const d = eye.distanceTo(s.pos);

    });
    cand.sort((a, b) => a[0] - b[0]);
    let budget = 5;                                             // 가림 검사는 한 프레임에 몇 개씩 돌아가며
    cand.slice(0, 12).forEach(([d, s]) => {
      if (budget > 0 && t - s.chk > 160) {
        s.chk = t;
        budget--;
        sdir.subVectors(s.pos, eye).normalize();
        s.seen = !rayGrid(eye, sdir, d - 0.2, 4);
      }
      s.show = s.seen;
      if (!s.show) return;
      sv.copy(s.pos).project(camera);
      if (sv.z > 1 || Math.abs(sv.x) > 1.2 || Math.abs(sv.y) > 1.2) { s.show = false; return; }
      const x = (sv.x * 0.5 + 0.5) * window.innerWidth, y = (-sv.y * 0.5 + 0.5) * window.innerHeight;
      const k = THREE.MathUtils.clamp(6 / d, 0.62, 1.25);

  const MM = { cache: {}, ctx: null, W: 0, H: 0, dpr: 1 };
  function mapFor(k) {
    if (MM.cache[k]) return MM.cache[k];
    const G = CG, T = G.T, lvl = floorNode[k].getWorldPosition(new THREE.Vector3()).y;
    let xa = Infinity, xb = -Infinity, za = Infinity, zb = -Infinity;
    for (let t = 0; t < G.n; t++) {
      if (G.FK[t] !== k) continue;
      const o = t * 9;
      for (let q = 0; q < 9; q += 3) {
        xa = Math.min(xa, T[o + q]); xb = Math.max(xb, T[o + q]);
        za = Math.min(za, T[o + q + 2]); zb = Math.max(zb, T[o + q + 2]);
      }
    }
    const W = MM.W, H = MM.H, pad = 8 * MM.dpr;
    const s = Math.min((W - 2 * pad) / (xb - xa), (H - 2 * pad) / (zb - za));
    const ox = (W - (xb - xa) * s) / 2, oy = (H - (zb - za) * s) / 2;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");

        for (const [lo, hi] of bands) {

  // ---------------------------------------------------------------- 걷기 시작 · 끝

    const k = (1.25 * THREE.MathUtils.degToRad(camera.fov)) / window.innerHeight;
    WK.yaw += dx * k;
    WK.pitch += dy * k;
    clampPitch();
    WK.dragAt = performance.now();
  });
  cvs.addEventListener("pointerup", (e) => {
    if (!WK.on || WK.lock) return;
    const D = WK.down;
    if (!D || D.id !== e.pointerId) return;
    WK.down = null;
    if (!D.moved && !D.multi && performance.now() - D.t < 700) tapWalk(e.clientX, e.clientY);
  });
  cvs.addEventListener("pointercancel", (e) => { if (WK.down && WK.down.id === e.pointerId) WK.down = null; });

  // ---------------------------------------------------------------- 카메라 전환 (PC: 마우스 고정 + WASD)
  $("w-cam").addEventListener("click", (e) => {
    if (WK.lock) { document.exitPointerLock(); return; }
    if (e.pointerType && e.pointerType !== "mouse") return;      // 손으로 누르면 안 켬
    stopPath();
    const r = cvs.requestPointerLock();
    if (r && r.catch) r.catch(() => {});
  });
  document.addEventListener("pointerlockchange", () => {
    const was = WK.lock;
    WK.lock = WK.on && document.pointerLockElement === cvs;
    if (was && !WK.lock) WK.unlockAt = performance.now();
    document.body.classList.toggle("wlock", WK.lock);
    $("w-cross").hidden = !WK.lock;
    $("w-cam").setAttribute("aria-pressed", String(WK.lock));
    WK.down = null;
    setHint();
  });

  // ---------------------------------------------------------------- 키보드
  const MOVE_KEYS = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight"]);
  walkKey = (e) => {
    if (!WK.on) return;
    if (e.key === "Escape" || e.key === "Esc") {
      e.preventDefault();                                       // 포털이 지도 전체를 닫지 않게
      if (document.pointerLockElement || performance.now() - WK.unlockAt < 700) return;   // 이 Esc 는 마우스 고정만 풂
      exitWalk();
      return;
    }
    if (MOVE_KEYS.has(e.code)) {
      if (!e.code.startsWith("Shift")) e.preventDefault();
      WK.keys.add(e.code);
    }
  };
  window.addEventListener("keyup", (e) => { WK.keys.delete(e.code); });
  window.addEventListener("blur", () => { WK.keys.clear(); });

  function walkFrame(t) {
    const dt = WK.t ? Math.min(0.1, Math.max(0, (t - WK.t) / 1000)) : 0;   // 느린 PC 에서도 걷는 속도는 같게 (충돌은 8cm 씩 나눠 계산)
    WK.t = t;
    const K = WK.keys;
    let fwd = 0, side = 0, turn = 0;
    if (K.has("ArrowUp") || K.has("KeyW")) fwd += 1;
    if (K.has("ArrowDown") || K.has("KeyS")) fwd -= 1;
    if (K.has("ArrowLeft")) turn += 1;
    if (K.has("ArrowRight")) turn -= 1;
    if (K.has("KeyA")) { if (WK.lock) side -= 1; else turn += 1; }
    if (K.has("KeyD")) { if (WK.lock) side += 1; else turn -= 1; }
    if (fwd || side || turn) { if (WK.path) stopPath(); }
    WK.yaw += turn * 1.8 * dt;
    if (fwd || side) {
      const sp = (K.has("ShiftLeft") || K.has("ShiftRight") ? 4.6 : 2.6) * dt;
      const f = fwd < 0 ? fwd * 0.7 : fwd;
      const sy = Math.sin(WK.yaw), cy = Math.cos(WK.yaw);
      moveBy((-sy * f + cy * side) * sp, (-cy * f - sy * side) * sp);
    } else if (WK.path) followPath(dt);
    WK.pos.y += (WK.ground - WK.pos.y) * Math.min(1, dt * 12);
    camera.position.set(WK.pos.x, WK.pos.y + EYE, WK.pos.z);
    camera.rotation.set(WK.pitch, WK.yaw, 0, "YXZ");
    camera.updateMatrixWorld();
    // 빛은 눈보다 1.2m 뒤·0.5m 위: 벽 바로 앞에 서도 화면이 새하얗게 타지 않게
    lamp.position.set(camera.position.x + Math.sin(WK.yaw) * 1.2, camera.position.y + 0.5, camera.position.z + Math.cos(WK.yaw) * 1.2);
    if (goal.visible) {
      const a = (performance.now() - WK.goalAt) / 1000;
      goal.scale.setScalar(1 + 0.12 * Math.sin(a * 6));
    }
    if (t - WK.tick > 200) { WK.tick = t; whereNow(); }
    doorsFrame(dt);
    renderer.render(scene, camera);
    drawSigns(t);
    drawMap();
  }

  // ---------------------------------------------------------------- 매 프레임
  const v = new THREE.Vector3(), tmp = new THREE.Vector3();
  function project(world, el, dx, dy) {
    v.copy(world).project(camera);
    if (v.z > 1 || v.z < -1) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    const x = (v.x * 0.5 + 0.5) * window.innerWidth + (dx || 0);
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight + (dy || 0);
    el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%,-50%)";
  }
  function place(l) {
    const node = floorNode[l.floor];
    if (!node) { l.el.hidden = true; return; }
    node.localToWorld(tmp.copy(l.p));
    project(tmp, l.el);
  }

  function frame(t) {
    if (WK.on) { walkFrame(t); requestAnimationFrame(frame); return; }
    let dy = 0;
    for (const id in EX) {
      const ex = EX[id];
      const prevE = easeOf(ex.p);
      ex.p += (ex.target - ex.p) * (reduce ? 1 : 0.07);
      if (Math.abs(ex.target - ex.p) < 1e-4) ex.p = ex.target;
      if (acts[id]) acts[id].act.time = Math.min(ex.p, 0.9999) * acts[id].dur;
      if (id === state.bld) {
        const L = LIFT[id] || LIFT.sol;
        dy = L(easeOf(ex.p)) - L(prevE);
      }
    }
    if (mixer) mixer.update(0);
    if (fly) {
      // 출발 시각과 같은 시계(performance.now)로 재고 0..1 로 묶음 (프레임 시각이 조금 앞설 때 튀지 않게)
      const k = THREE.MathUtils.clamp((performance.now() - fly.t0) / (fly.dur || 900), 0, 1);
      const e = easeOf(k);
      if (fly.dyn) { const d = fly.dyn(); fly.b = d.tgt; fly.pb = d.pos; }
      controls.target.lerpVectors(fly.a, fly.b, e);
      camera.position.lerpVectors(fly.pa, fly.pb, e);
      // 층을 따라가는 비행은 분해가 다 끝날 때까지 붙어 있음
      if (k >= 1 && (!fly.dyn || Object.values(EX).every((x) => x.p === x.target))) fly = null;
    } else if (dy) {
      controls.target.y += dy;
      camera.position.y += dy;
    }
    if (state.zoomGoal != null) {
      const off = camera.position.clone().sub(controls.target);
      const dist = off.length();
      const nd = reduce ? state.zoomGoal : dist + (state.zoomGoal - dist) * 0.18;
      camera.position.copy(controls.target).add(off.setLength(nd));
      if (Math.abs(state.zoomGoal - nd) < 0.05) state.zoomGoal = null;
    }
    wheelStep();
    controls.update();
    scene.updateMatrixWorld();
    if (floorKeys().length) updateRoute(t);
    renderer.render(scene, camera);

    const p = EX[state.bld].p;
    const pct = Math.round(p * 100);
    if (pct !== shown) {
      shown = pct;
      $("gval").textContent = pct + "%";
      if (document.activeElement !== slider) slider.value = pct;
    }
    if (!floorKeys().length) { requestAnimationFrame(frame); return; }
    floorLabels.forEach((l) => {
      const fo = Math.min(1, Math.max(0, (EX[bldOf(l.floor)].p - 0.25) / 0.3));
      l.el.style.opacity = fo;
      l.el.style.pointerEvents = fo > 0.5 ? "auto" : "none";
      place(l);
    });
    roomLabels.forEach((l) => {
      const on = state.sel === l.floor;
      l.el.hidden = !on;
      if (on) place(l);
    });
    const near = camera.position.distanceTo(controls.target) < 120;
    seatLabels.forEach((l) => {
      const on = near && state.sel === l.floor;
      l.el.hidden = !on;
      if (on) place(l);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
