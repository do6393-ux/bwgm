<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>부원 교실 화면</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #2b2b2b;
        color: #f5f5f5;
        font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
        text-align: center;
      }
      p { margin: 0; }
      .big { font-size: 26px; font-weight: bold; }
      .small { font-size: 17px; color: #bdbdbd; }
    </style>
  </head>
  <body>
    <p class="big">교실 화면을 불러오지 못했어요.</p>
    <p class="small">인터넷 연결을 확인해 주세요. 30초마다 저절로 다시 시도해요.</p>
  </body>
</html>
